name: Sync default.json to target repo

on:
  push:
    branches:
      - BookSource

jobs:
  sync-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if default.json or default.json.gzip was updated in this commit
        id: check-file
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE "^test/BookSource/default\.json(\.gzip)?$"; then
            echo "file_changed=true" >> "$GITHUB_OUTPUT"
            echo "default.json or default.json.gzip was updated in this commit."
          else
            echo "file_changed=false" >> "$GITHUB_OUTPUT"
            echo "Neither default.json nor default.json.gzip was updated in this commit; skipping sync."
          fi

      - name: Fail if files missing
        if: steps.check-file.outputs.file_changed == 'true'
        run: |
          if [ ! -f "test/BookSource/default.json" ] && [ ! -f "test/BookSource/default.json.gzip" ]; then
            echo "Neither file found; nothing to do."
            exit 0
          fi

      - name: Configure git
        if: steps.check-file.outputs.file_changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone target repo
        if: steps.check-file.outputs.file_changed == 'true'
        env:
          TARGET_REPO: SJJ-dot/Reader
          TARGET_TOKEN: ${{ secrets.GITHUBTOKEN }}
        run: |
          if [ -z "$TARGET_REPO" ] || [ -z "$TARGET_TOKEN" ]; then
            echo "TARGET_REPO or TARGET_TOKEN secret not set"
            exit 1
          fi
          git clone "https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}.git" target-repo
          ls -la target-repo || (echo "Clone failed" && exit 1)

      - name: Copy files into target repo and commit
        if: steps.check-file.outputs.file_changed == 'true'
        id: push-file
        env:
          TARGET_BRANCH: "BookSource"
          TARGET_DIR: "test/BookSource"
        run: |
          cd target-repo
          git fetch origin
          if git rev-parse --verify "origin/${TARGET_BRANCH}" >/dev/null 2>&1; then
            git checkout --track "origin/${TARGET_BRANCH}" || git checkout "${TARGET_BRANCH}"
          else
            git checkout -b "${TARGET_BRANCH}"
          fi
          mkdir -p "${TARGET_DIR}"
          # copy both files if they exist
          for f in default.json default.json.gzip; do
            if [ -f "../${TARGET_DIR}/${f}" ]; then
              cp "../${TARGET_DIR}/${f}" "${TARGET_DIR}/${f}"
            fi
          done
          if git status --porcelain | grep -q .; then
            git add "${TARGET_DIR}/default.json" "${TARGET_DIR}/default.json.gzip"
            git commit -m "Sync default.json from source repo (BookSource branch) [ci skip]" || true
            git push origin "${TARGET_BRANCH}" --force
            echo "Files pushed to ${TARGET_BRANCH} in target repo."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr CDN cache
        if: steps.check-file.outputs.file_changed == 'true' && steps.push-file.outputs.pushed == 'true'
        run: |
          curl "https://purge.jsdelivr.net/gh/SJJ-dot/Reader/test/BookSource/default.json"
          curl "https://purge.jsdelivr.net/gh/SJJ-dot/Reader/test/BookSource/default.json.gzip"
