name: assembleRelease

on:
  workflow_dispatch:

# create-release 需要用 token 创建 Release，必须显式授予写权限（新仓库默认只读）
permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Gradle (caches dependencies + build/config cache)
        # v3 内置的旧版 cache 客户端已被 GitHub 缓存服务拒绝（restore 400），v4+ 才支持现行 cache service v2
        uses: gradle/actions/setup-gradle@v6

      - name: Change log
        id: changelog
        run: |
          sudo apt-get install jq
          changelog=$(awk '!/##/{print} /##/{exit}' CHANGELOG.md && awk '/##/{if (found) exit; found=1} found' CHANGELOG.md | sed '1d')
          echo "$changelog" >> changelog.txt
          changelog=$(printf '%s' "$changelog" | jq -Rs .)
          echo "CHANGELOG=$changelog" >> $GITHUB_ENV

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # v2/v3 会安装已下线的 tools 包（sdkmanager tools -> Failed to find package 'tools' -> exit 1），必须用 v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 显式安装与 compileSdk(36) 匹配的 platform/build-tools，避免 aapt 依赖镜像预装版本
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Chaquopy 构建期会执行 pip install，缓存 pip 下载目录可明显加速
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Create local.properties
        run: |
          echo "bugly.appId=${{ secrets.BUGLY_APP_ID }}" >> local.properties
          echo "pgy.apiKey=${{ secrets.PGY_KEY }}" >> local.properties
          echo "pgy.appKey=${{ secrets.PGY_APP_KEY }}" >> local.properties
          echo "sign.storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> local.properties
          echo "sign.keyAlias=${{ secrets.ALIAS }}" >> local.properties
          echo "sign.keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "python=$(which python)" >> local.properties

      - name: Build and sign APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
          ls app/build/outputs/apk/release/

      - name: Get APK version info
        run: |
          ls ${{ env.ANDROID_HOME }}/build-tools/
          # 动态取最新 aapt，避免 build-tools 版本升级后写死路径失效
          aapt=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)
          echo "aapt: $aapt"
          apk_file=$(ls app/build/outputs/apk/release/*.apk | tail -n 1)
          version_code=$("$aapt" dump badging "$apk_file" | awk '/versionCode/ {print $3}' | cut -d"'" -f2)
          version_name=$("$aapt" dump badging "$apk_file" | awk '/versionName/ {print $4}' | cut -d"'" -f2)
          echo "APK_FILE=$apk_file" >> $GITHUB_ENV
          echo "VERSION_CODE=$version_code" >> $GITHUB_ENV
          echo "VERSION_NAME=$version_name" >> $GITHUB_ENV
          echo "TAG_NAME=$version_name" >> $GITHUB_ENV

          echo "VERSION_CODE=$version_code"
          echo "VERSION_NAME=$version_name"
          echo "TAG_NAME=$version_name"

      - name: Upload to Pgyer
        run: |
          chmod +x ./pgyer_upload.sh
          bash ./pgyer_upload.sh -k ${{ secrets.PGY_KEY }} -d ${{env.CHANGELOG}} "${{ env.APK_FILE }}"

      # 用 action-gh-release 替代已归档的 actions/create-release@v1 + actions/upload-release-asset@v1
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUBTOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body_path: changelog.txt
          draft: false
          prerelease: false
          files: ${{ env.APK_FILE }}
