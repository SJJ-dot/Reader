android {
    namespace = 'io.legado.app'
    compileSdk = libs.versions.androidCompileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.androidMinSdk.get().toInteger()
        consumerProguardFiles "consumer-rules.pro", 'cronet-proguard-rules.pro'
        // Provide placeholder required by legado-engine's manifest
        manifestPlaceholders = [APP_CHANNEL_VALUE: "default"]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

