## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Fri Jul 09 22:59:28 CST 2021
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options\="-Xmx4096M" --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7899
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7899
systemProp.org.gradle.internal.http.tlsVersion=TLSv1.2,TLSv1.3
systemProp.http.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3

# Enable the Gradle build cache. Task outputs are stored in the local build cache
# (~/.gradle/build-cache), which gradle/actions/setup-gradle@v3 saves/restores
# between CI runs, so unchanged tasks resolve FROM-CACHE instead of re-executing.
org.gradle.caching=true

# Prebuilt AAR libraries. Run ./gradlew publishLibs to (re)publish :fastscroller,
# :modules:rhino and :legado-engine into <root>/repo, then bump libsVersion so the
# app picks up the new artifacts (or use --refresh-dependencies).
# usePrebuiltLibs=true  -> app depends on the published AARs (no per-build lib recompile)
# usePrebuiltLibs=false -> app depends on the source project modules (for editing the libs)
usePrebuiltLibs=true
libsVersion=1.0.1
