<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>用户反馈</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ==================== 访问令牌门禁 ==================== -->
<main class="gate" id="view-gate">
  <div class="gate-card">
    <div class="gate-mark">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v10H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </div>
    <h1 id="gate-title">正在验证访问令牌…</h1>
    <p class="gate-tip" id="gate-tip" hidden>请从 App 内打开反馈，或在下方输入访问令牌。</p>
    <div id="gate-form" hidden>
      <input id="in-gate-token" type="password" placeholder="访问令牌" autocomplete="current-password" />
      <button class="btn btn-primary btn-block" id="btn-gate-enter" type="button">进入</button>
    </div>
    <p class="gate-err" id="gate-err" hidden></p>
  </div>
</main>

<div class="shell" id="app-shell" hidden>

  <!-- ==================== 提交反馈 ==================== -->
  <main class="view is-active" id="view-submit">
    <header class="topbar">
      <p class="sub">提交问题或建议，我们会在这里回复你</p>
    </header>

    <div class="banner" id="sdk-banner" hidden>
      资源加载失败，请检查网络后刷新页面重试。
    </div>

    <form class="card" id="form-submit" autocomplete="off" novalidate>
      <div class="field">
        <label>反馈类型</label>
        <div class="chips" id="cat-chips">
          <button type="button" class="chip is-on" data-cat="问题反馈">问题反馈</button>
          <button type="button" class="chip" data-cat="功能建议">功能建议</button>
          <button type="button" class="chip" data-cat="使用咨询">使用咨询</button>
          <button type="button" class="chip" data-cat="其他">其他</button>
        </div>
      </div>

      <div class="field">
        <label for="in-title">标题</label>
        <input id="in-title" maxlength="60" placeholder="一句话概括你的问题" />
      </div>

      <div class="field">
        <label for="in-content">详细描述</label>
        <textarea id="in-content" rows="5" maxlength="2000" placeholder="发生了什么？你期望的结果是什么？"></textarea>
        <div class="counter"><span id="content-count">0</span>/2000</div>
      </div>

      <div class="field">
        <label>联系方式<span class="opt">（选填，方便我们联系你）</span></label>
        <div class="row2">
          <input id="in-nickname" maxlength="20" placeholder="你的称呼" />
          <input id="in-contact" maxlength="60" placeholder="手机 / 邮箱" />
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="btn-submit" type="submit">提交反馈</button>
      <p class="hint">提交后会生成一个「查询码」，凭它随时查看进度、继续对话。</p>
    </form>
  </main>

  <!-- ==================== 我的反馈 ==================== -->
  <main class="view" id="view-mine">
    <header class="topbar">
      <p class="sub">输入查询码，或从下方记录中直接打开</p>
    </header>

    <div class="card">
      <div class="field" style="margin-bottom:0">
        <label for="in-code">查询码</label>
        <div class="row-inline">
          <input id="in-code" maxlength="12" placeholder="例如 7K2M4QX9" autocapitalize="characters" />
          <button class="btn btn-primary" id="btn-open-code" type="button">打开</button>
        </div>
      </div>
    </div>

    <div class="section-title">本机提交记录</div>
    <div class="list" id="code-list"></div>
  </main>

  <!-- ==================== 管理后台 ==================== -->
  <main class="view" id="view-admin">
    <header class="topbar">
      <p class="sub" id="admin-sub">查看并回复用户反馈</p>
    </header>

    <div class="card" id="admin-login-card">
      <div class="field" style="margin-bottom:14px">
        <label for="in-pass">管理口令</label>
        <input id="in-pass" type="password" placeholder="请输入管理口令" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary btn-block" id="btn-admin-login" type="button">登录</button>
      <p class="hint">登录成功后会自动记住，下次打开自动登录。</p>
    </div>

    <div id="admin-panel" hidden>
      <div class="stats" id="admin-stats"></div>

      <div class="chips" id="admin-filters">
        <button type="button" class="chip is-on" data-f="all">全部</button>
        <button type="button" class="chip" data-f="open">待处理</button>
        <button type="button" class="chip" data-f="resolved">已解决</button>
        <button type="button" class="chip" data-f="closed">已关闭</button>
      </div>

      <div class="list" id="admin-list"></div>

      <button class="btn btn-ghost btn-block" id="btn-admin-logout" type="button">退出登录</button>
    </div>
  </main>
</div>

<!-- ==================== 会话面板 ==================== -->
<section class="sheet" id="sheet" hidden>
  <header class="sheet-head">
    <button class="icon-btn" id="sheet-back" type="button" aria-label="返回">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="sheet-title">
      <div class="sheet-name" id="sheet-title">会话</div>
      <div class="sheet-sub" id="sheet-sub"></div>
    </div>
    <span class="badge" id="sheet-badge" hidden></span>
  </header>

  <div class="msgs" id="msgs"></div>

  <div class="sheet-foot">
    <div class="row-actions" id="user-actions" hidden>
      <button class="btn btn-mini" id="btn-copy-code" type="button">复制查询码</button>
    </div>
    <div class="row-actions" id="admin-actions" hidden>
      <button class="btn btn-mini" data-st="open" type="button">标记待处理</button>
      <button class="btn btn-mini" data-st="resolved" type="button">标记已解决</button>
      <button class="btn btn-mini" data-st="closed" type="button">关闭</button>
      <button class="btn btn-mini btn-danger" id="btn-del-thread" type="button">删除</button>
    </div>
    <div class="composer">
      <textarea id="in-reply" rows="1" maxlength="2000" placeholder="输入内容…"></textarea>
      <button class="btn btn-primary btn-send" id="btn-send" type="button">发送</button>
    </div>
  </div>
</section>

<!-- ==================== 提交成功 ==================== -->
<section class="overlay" id="result-sheet" hidden>
  <div class="result-card">
    <div class="result-mark">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2>反馈已提交</h2>
    <p class="result-tip">请保存下面的查询码，凭它可以随时查看回复并继续对话。</p>
    <div class="code-box" id="result-code">--------</div>
    <button class="btn btn-ghost btn-block" id="btn-copy-result" type="button">复制查询码</button>
    <button class="btn btn-primary btn-block" id="btn-goto-thread" type="button">查看对话</button>
    <button class="btn btn-text btn-block" id="btn-result-close" type="button">再提一条</button>
  </div>
</section>

<!-- ==================== 确认框 ====================
     刻意不用原生 window.confirm：在 WebView 里它的标题栏会显示当前页面网址
     （appassets.androidplatform.net / 线上域名），既难看又像要跳转。 -->
<section class="overlay" id="confirm-sheet" hidden>
  <div class="result-card confirm-card">
    <h2 id="confirm-title">确认操作</h2>
    <p class="result-tip" id="confirm-msg"></p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" id="confirm-cancel" type="button">取消</button>
      <button class="btn btn-danger-solid" id="confirm-ok" type="button">确定</button>
    </div>
  </div>
</section>

<nav class="tabbar" id="app-tabbar" hidden>
  <button class="tab is-on" data-view="submit" type="button">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 20h4L18 10l-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span>提交</span>
  </button>
  <button class="tab" data-view="mine" type="button">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5h16v11H8l-4 4V5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span>我的</span>
  </button>
  <button class="tab" data-view="admin" type="button">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6l7-3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span>管理</span>
  </button>
</nav>

<div class="toast" id="toast" hidden></div>

<!-- SDK 改为由 app.js 按需加载：App 内置页面走原生桥，不需要这个 SDK，避免拖慢首屏 -->
<script src="app.js"></script>
</body>
</html>
